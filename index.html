<script>window.__SEED__=[{"n": 1, "t": "घर में पधारो गजानन जी मेरे घर में पधारो", "l": "घर में पधारो गजानन जी मेरे घर में पधारो\nरिद्धि सिद्धि लेके आओ गणराजा मेरे घर में पधारो\nरामजी आना लक्ष्मण जी आना\nसंग में लाना सीता मैया\nमेरे घर में पधारो घर में पधारो गजानन जी...\nब्रह्मा जी आना विष्णु जी आना\nभोले शंकर जी को ले आना\nमेरे घर में पधारो घर में पधारो गजानन जी...\nलक्ष्मी जी आना गौरी जी आना\nसरस्वती मैया को ले आना\nमेरे घर में पधारो घर में पधारो गजानन जी...\nविघ्न को हरना मंगल करना\nकारज शुभ कर जाना\nमेरे घर में पधारो घर में पधारो गजानन जी..."}, {"n": 2, "t": "अच्युतम केशवं कृष्ण दामोदरं", "l": "अच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nकौन कहता है भगवान आते नहीं,\nतुम मीरा के जैसे बुलाते नहीं ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nकौन कहता है भगवान खाते नहीं,\nबेर शबरी के जैसे खिलाते नहीं ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nकौन कहता है भगवान सोते नहीं,\nमाँ यशोदा के जैसे सुलाते नहीं ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nकौन कहता है भगवान नाचते नहीं,\nगोपियों की तरह तुम नचाते नहीं ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nनाम जपते चलो काम करते चलो,\nहर समय कृष्ण का ध्यान करते चलो ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।\nयाद आएगी उनको कभी ना कभी,\nकृष्ण दर्शन तो देंगे कभी ना कभी ।\nअच्युतम केशवं कृष्ण दामोदरं,\nराम नारायणं जानकी वल्लभम् ।"}, {"n": 3, "t": "श्याम चूड़ी बेचने आया", "l": "मनिहारी का भेस बनाया, श्याम चूड़ी बेचने आया।\nछलिया का भेस बनाया, श्याम चूड़ी बेचने आया॥\nझोली कंधे धरी, उस में चूड़ी भरी।\nगलियों में शोर मचाया, श्याम चूड़ी बेचने आया॥\nराधा ने सुनी, ललिता से कही।\nमोहन को तुरंत बुलाया, श्याम चूड़ी बेचने आया॥\nचूड़ी लाल नहीं पहनूँ, चूड़ी हरी नहीं पहनूँ।\nमुझे श्याम रंग है भाया, श्याम चूड़ी बेचने आया॥\nराधा पहनन लगी, श्याम पहनाने लगे।\nराधा ने हाथ बढ़ाया, श्याम चूड़ी बेचने आया॥\nराधे कहने लगी, तुम हो छलिया बड़े।\nधीरे से हाथ दबाया, श्याम चूड़ी बेचने आया॥"}, {"n": 4, "t": "हम तो तेरी शरण में", "l": "हम तो तेरी शरण में आये, श्री बालाजी गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥धृ॥\nदूर देश से चलकर भगवन, तिरुपति हम आये हैं\nआपके चरणों में अर्पण करने, प्रेम भेंट हम लाये हैं\nहमको अपनी शरण में ले लो, श्री बालाजी गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥1॥\nगोविंद राजजी के दर्शन करके, तिरुमलै हम आये हैं\nवेदशास्त्र की महिमा सुनकर, पुष्करणी में नहाये हैं\nवराहस्वामी जी की करी रे अर्चना, तेरी खातिर गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥2॥\nप्रथम आपकी नगरी में हम, सारे दर्शन पाये हैं\nआपके दर्शन पाने को हम, धर्म की बारी लगाये हैं\nउस बारी के पिंजरे में हम, नाम रटे हैं गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥3॥\nजैसे तैसे करके भगवन, आपके सन्मुख आये हैं\nजरगुंडी जरगुंडी कहकर, हमको दूर हटावे हैं\nमन की आशा अधूरी रह गयी, तेरी खातिर गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥4॥\nप्रभुजी तुम हो जग के ठाकुर, हम भी तुमसे मिला करें\nइतनी सी है बिनती प्रभुजी, आपके दर्शन हुआ करें\nसत्संग मंडल ने लिख दी हुंडी, आप स्वीकारो गोविंदा\nलाज बचाओ आज हमारी, व्यंकटरमणा गोविंदा ॥5॥"}, {"n": 5, "t": "सांवरी सूरत पे मोहन", "l": "सांवरी सूरत पे मोहन,\nदिल दीवाना हो गया,\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे नैन तिरछे,\nदूसरा काजल लगा,\nतीसरा नज़रें मिलाना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे होंठ पतले,\nदूसरा लाली लगी,\nतीसरा तेरा मुस्कुराना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे हाथ कोमल,\nदूसरा मेहंदी लगी,\nतीसरा बंसी बजाना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे पाँव नाज़ुक,\nदूसरा पायल बँधी,\nतीसरा घुँघरू बजाना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे भोग छप्पन,\nदूसरा माखन धरा,\nतीसरा खीचड़े का खाना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nएक तो तेरे साथ राधा,\nदूसरा रुक्मिणी खड़ी,\nतीसरा मीरा का आना,\nदिल दीवाना हो गया।\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥\nसांवरी सूरत पे मोहन,\nदिल दीवाना हो गया,\nदिल दीवाना हो गया मेरा,\nदिल दीवाना हो गया ॥"}, {"n": 6, "t": "मेरा आपकी कृपा से सब काम हो रहा", "l": "मेरा आपकी कृपा से सब काम हो रहा है,\nकरते हो तुम कन्हैया मेरा नाम हो रहा है ॥\nपतवार के बिना ही मेरी नाव चल रही है,\nबिन माँगे हे कन्हैया हर चीज़ मिल रही है ॥\nअब क्या बताऊँ मोहन आराम हो रहा है,\nमेरा आपकी कृपा से सब काम हो रहा है ॥\nमेरी ज़िंदगी में तुम हो किस बात की कमी है,\nमुझे और अब किसी की परवाह भी नहीं है ॥\nतेरी बदौलतों से सब काम हो रहा है,\nमेरा आपकी कृपा से सब काम हो रहा है ॥\nदुनिया में होंगे लाखों तेरे जैसा कौन होगा,\nतुझ जैसा बंदा परवर भला ऐसा कौन होगा ॥\nअरे थामा है तेरा दामन आराम हो रहा है,\nमेरा आपकी कृपा से सब काम हो रहा है ॥"}, {"n": 7, "t": "थाली भर कर ल्याई रे खीचड़ो", "l": "थाली भर कर ल्याई रे खीचड़ो,\nऊपर घी की बाटकी,\nजीमो म्हारा श्याम धणी,\nजिमावे बेटी जाट की,\nया करमा बेटी जाट की......\nबाबो म्हारो गाँव गयो है,\nना जाणे कद आवेलो,\nऊके भरोसे बैठ्यो रह्यो तो,\nभूखो ही रह जावेलो,\nआज जिमाऊँ तने रे खीचड़ो,\nकाल राबड़ी छाछ की,\nजीमो म्हारा श्याम धणी,\nजिमावे बेटी जाट की,\nया करमा बेटी जाट की......\nबार बार मंदिर ने जड़ती,\nबार बार मैं खोलती,\nकईयां कोनी जीमे रे मोहन,\nकरड़ी करड़ी बोलती,\nतू जीमे लो जद मैं जीमूँ,\nमानूँ ना कोई लाड की,\nजीमो म्हारा श्याम धणी,\nजिमावे बेटी जाट की,\nया करमा बेटी जाट की......\nपरदो भूल गई सांवरिया,\nपरदो फेर लगायो जी,\nधावलिया की ओल बैठ के,\nश्याम खीचड़ो खायो जी,\nभोला भाला भगतां से,\nसांवरिया कईयां आंट की,\nजीमो म्हारा श्याम धणी,\nजिमावे बेटी जाट की,\nया करमा बेटी जाट की......\nभक्ति हो तो करमा जैसी,\nसांवरियो घर आवेलो,\nसोहन लाल लोहकार प्रभु का,\nहरख हरख गुण गावेलो,\nसांचो प्रेम प्रभु से हो तो,\nमूरत बोले काठ की,\nजीमो म्हारा श्याम धणी,\nजिमावे बेटी जाट की,\nया करमा बेटी जाट की......"}, {"n": 8, "t": "छोटी छोटी गैया, छोटे छोटे ग्वाल", "l": "छोटी छोटी गैया, छोटे छोटे ग्वाल ।\nछोटो सो मेरो मदन गोपाल ॥\nआगे आगे गैया, पीछे पीछे ग्वाल ।\nबीच में मेरो मदन गोपाल ॥\nकारी कारी गैया, गोरे गोरे ग्वाल ।\nश्याम वरण मेरो मदन गोपाल ॥\nघास खाए गैया, दूध पीवे ग्वाल ।\nमाखन खावे मेरो मदन गोपाल ॥\nछोटी छोटी लकुटी, छोटे छोटे हाथ ।\nबंसी बजावे मेरो मदन गोपाल ॥\nछोटी छोटी सखियाँ, मधुबन बाग ।\nरास रचावे मेरो मदन गोपाल ॥"}, {"n": 9, "t": "सीताराम सीताराम सीताराम कहिए", "l": "सीताराम सीताराम सीताराम कहिए,\nजाहि विधि राखे राम ताहि विधि रहिए ॥\nमुख में हो राम नाम, राम सेवा हाथ में,\nतू अकेला नहीं प्यारे, राम तेरे साथ में,\nविधि का विधान जान, हानि-लाभ सहिए ॥\nकिया अभिमान तो फिर मान नहीं पाएगा,\nहोगा वही प्यारे जो श्रीराम जी को भाएगा,\nफल आशा त्याग शुभ कर्म करते रहिए ॥\nज़िंदगी की डोर सौंप हाथ दीनानाथ के,\nमहलों में राखे चाहे झोंपड़ी में वास दे,\nधन्यवाद निर्विवाद राम राम कहिए ॥\nआशा एक राम जी से दूजी आशा छोड़ दे,\nनाता एक राम जी से दूजा नाता तोड़ दे,\nकाम रस त्याग प्यारे राम रस गहिए ॥"}, {"n": 10, "t": "एक दिन वो भोले भंडारी", "l": "एक दिन वो भोले भंडारी,\nबन कर ब्रज की नारी,\nगोकुल में आ गए...\nपार्वती जी मना के हारी,\nना माने त्रिपुरारी,\nगोकुल में आ गए...\nपार्वती से बोले स्वामी,\nमैं भी चलूँगा तेरे साथ में,\nराधा संग श्याम नाचे,\nमैं भी नाचूँगा तेरे साथ में,\nरास रचेगा ब्रज में भारी,\nहमें दिखाओ प्यारी, गोकुल में आ गए,\nएक दिन वो भोले भंडारी....\nओ मेरे भोले स्वामी,\nकैसे ले जाऊँ अपने साथ में,\nमोहन के सिवा वहाँ,\nदूजा ना कोई इस रास में,\nहँसी करेगी ब्रज की नारी,\nमानो बात हमारी, गोकुल में आ गए,\nएक दिन वो भोले भंडारी....\nऐसा बना दो मुझको,\nकोई ना जाने इस राज़ को,\nमैं हूँ सहेली तेरी,\nऐसा बताना ब्रज राज को,\nबना के जूड़ा पहन के साड़ी,\nचाल चले मतवाली, गोकुल में आ गए,\nएक दिन वो भोले भंडारी....\nहँस के सती ने कहा,\nबलिहारी जाऊँ इस रूप पे,\nइक दिन तुम्हारे लिए,\nआए मुरारी इस रूप में,\nमोहिनी रूप बनाया मुरारी,\nअब है तुम्हारी बारी, गोकुल में आ गए,\nएक दिन वो भोले भंडारी....\nदेखा मोहन ने जब,\nसमझ गए वो सारी बात रे,\nऐसी बजाई बंसी,\nसुध बुध भूले भोलेनाथ रे,\nसरक गयी जब सर से चुनरी,\nमुस्काए गिरधारी, गोकुल में आ गए,\nएक दिन वो भोले भंडारी....\nदीनदयालु तेरा तब से,\nगोपेश्वर हुआ नाम रे,\nओ भोले बाबा तेरा,\nवृन्दावन में बना धाम रे,\nताराचंद कहे त्रिपुरारी,\nरखियो लाज हमारी, गोकुल में आ गए,\nएक दिन वो भोले भंडारी...."}, {"n": 11, "t": "दुनिया चले ना श्री राम के बिना", "l": "दुनिया चले ना श्री राम के बिना,\nराम जी चले ना हनुमान के बिना ।\nजब से रामायण पढ़ ली है, एक बात मैंने समझ ली है,\nरावण मरे ना श्री राम के बिना, लंका जले ना हनुमान के बिना ॥\nलक्ष्मण का बचना मुश्किल था, कौन बूटी लाने के काबिल था,\nलक्ष्मण बचे ना श्री राम के बिना, बूटी मिले ना हनुमान के बिना ॥\nसीता हरण की कहानी सुनो, बनवारी मेरी ज़ुबानी सुनो,\nवापिस मिले ना श्री राम के बिना, पता चले ना हनुमान के बिना ॥\nबैठे सिंहासन पे श्री राम जी, चरणों में बैठे हैं हनुमान जी,\nमुक्ति मिले ना श्री राम के बिना, भक्ति मिले ना हनुमान के बिना ॥"}, {"n": 12, "t": "राधे राधे जपो चले आएँगे बिहारी", "l": "राधे राधे जपो चले आएँगे बिहारी,\nराधे राधे रटो चले आएँगे बिहारी,\nआएँगे बिहारी चले आएँगे बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा मेरी चंदा,\nचकोर है बिहारी,\nराधा मेरी चंदा,\nचकोर है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी मिश्री,\nतो स्वाद है बिहारी,\nराधा रानी मिश्री,\nतो स्वाद है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी गंगा,\nतो धार है बिहारी,\nराधा रानी गंगा,\nतो धार है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी तन है तो,\nप्राण है बिहारी,\nराधा रानी तन है तो,\nप्राण है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी सागर,\nतरंग है बिहारी,\nराधा रानी सागर,\nतरंग है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी मोहनी,\nतो मोहन है बिहारी,\nराधा रानी मोहनी,\nतो मोहन है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा मेरी गोरी तो,\nसाँवरे बिहारी,\nराधा मेरी गोरी तो,\nसाँवरे बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी भोली भाली,\nचंचल बिहारी,\nराधा रानी भोली भाली,\nचंचल बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी नथनी,\nतो कंगन बिहारी,\nराधा रानी नथनी,\nतो कंगन बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधा रानी मुरली,\nतो तान है बिहारी,\nराधा रानी मुरली,\nतो तान है बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥\nराधे राधे जपो चले आएँगे बिहारी,\nराधे राधे रटो चले आएँगे बिहारी,\nआएँगे बिहारी चले आएँगे बिहारी,\nराधे राधे जपो चले आएँगे बिहारी ॥"}, {"n": 13, "t": "मीठे रस से भरी रे, राधा रानी लागे", "l": "मीठे रस से भरी रे, राधा रानी लागे,\nम्हने कारो कारो जमुनाजी रो पानी लागे\nयमुना मैया कारी कारी, राधा गोरी गोरी\nवृन्दावन में धूम मचावे, बरसाना री छोरी\nब्रजधाम राधाजू की रजधानी लागे\nमीठे रस से भरी रे, राधा रानी लागे.....\nकान्हा नित मुरली में टेरे, सुमरे बारम्बार\nकोटिन रूप धरे मनमोहन, तऊ ना पावे पार\nरूप रंग की छबीली पटरानी लागे\nमीठे रस से भरी रे, राधा रानी लागे.....\nना भावे म्हने माखन-मिसरी, अब ना कोई मिठाई\nम्हारी जीभड़िया ने भावे अब तो राधा नाम मलाई\nवृषभानु की लाली तो गुड़धानी लागे\nमीठे रस से भरी रे, राधा रानी लागे.....\nराधा राधा नाम रटत है जो नर आठों याम\nतिनकी बाधा दूर करत है राधा राधा नाम\nराधा नाम से सफल ज़िंदगानी लागे\nमीठे रस से भरी रे, राधा रानी लागे....."}, {"n": 14, "t": "रुपैया पैसा सोना चांदी धन बरसा दे रे", "l": "रुपैया पैसा सोना चांदी धन बरसा दे रे,\nकन्हैया टाटा और अम्बानी जैसा मुझे बना दे रे,\nसभी को तू ही देता, सभी के दुःख हर लेता,\nदया मुझपे भी कर दे, बना दे मुझको नेता,\nकैबिनेट में पोर्टफोलियो मुझे दिला दे रे,\nकन्हैया टाटा और अम्बानी जैसा मुझे बना दे रे ॥\nमुझे तो डॉलर दे दे, मुझे तो पौंड दे दे,\nकहीं भी कैश कर लूँ, तू ऐसा बॉन्ड दे दे,\nस्विस बैंक में मेरा भी खाता खुलवा दे रे,\nकन्हैया टाटा और अम्बानी जैसा मुझे बना दे रे ॥\nबना क्रिकेटर ऐसा, सचिन तेंदुलकर जैसा,\nदेश का नाम कर दूँ, बनूँ गावस्कर जैसा,\nधोनी जैसे छक्के तू मुझसे लगवा दे रे,\nकन्हैया टाटा और अम्बानी जैसा मुझे बना दे रे ॥\nतेरा हो जाए इशारा, मेरा चमके सितारा,\nचलूँ तेरी राहों पे, बनूँ हारे का सहारा,\nहर्ष भगत की सेठ श्याम किस्मत चमका दे रे,\nकन्हैया टाटा और अम्बानी जैसा मुझे बना दे रे ॥"}, {"n": 15, "t": "अरे द्वारपालों कन्हैया से कह दो", "l": "अरे द्वारपालों कन्हैया से कह दो,\nदर पे सुदामा गरीब आ गया है।\nभटकते भटकते ना जाने कहाँ से,\nतुम्हारे महल के करीब आ गया है ॥\nना सर पे है पगड़ी, ना तन पे है जामा,\nबता दो कन्हैया को नाम है सुदामा।\nइक बार मोहन से जाकर के कह दो,\nमिलने सखा बदनसीब आ गया है ॥\nसुनते ही दौड़े चले आये मोहन,\nलगाया गले से सुदामा को मोहन।\nहुआ रुक्मिणी को बहुत ही अचम्भा,\nयह मेहमान कैसा अजीब आ गया है ॥\nबराबर पे अपने सुदामा बिठाये,\nचरण आँसुओं से श्याम ने धुलाये।\nन घबराओ प्यारे ज़रा तुम सुदामा,\nख़ुशी का समां तेरे करीब आ गया है ॥"}, {"n": 16, "t": "तेरी मंद मंद मुस्कनिया पे बलिहार राघव जी", "l": "तेरी मंद मंद मुस्कनिया पे बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरी मुस्कनिया पे, तेरी मुस्कनिया पे\nबलिहार राघव जी, बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरे बाल बड़े घुंघराले, बादल जो कारे कारे\nतेरे पाँव की पैजनिया पे बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरी चाल अजब मतवाली, लगती है प्यारी प्यारी\nतेरी पायल की झंकार पे बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरे संग में सिया सुकुमारी, लगती है प्यारी प्यारी\nइस युगल जोड़ी पर जाऊँ मैं बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरे नैन बड़े कजरारे, लगते हैं प्यारे प्यारे\nतेरी मधुर मधुर मुस्कनिया पे बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥\nतेरी मुस्कनिया पे, तेरी मुस्कनिया पे\nबलिहार राघव जी, बलिहार राघव जी\nतेरी मंद मंद मुस्कनिया पे बलिहार राघव जी ॥"}, {"n": 17, "t": "ये चमक ये दमक", "l": "ये चमक ये दमक,\nफूलवन मा महक,\nसब कुछ सरकार तुम्हई से है,\nइठला के पवन,\nचूमे सैयाँ के चरण,\nबगियन मा बहार तुम्हई से है ॥\nमेरे सुख दुःख की रखते हो खबर,\nमेरे सर पर साया तुम्हारा है,\nमेरी नैया के खेवनहार तुम्हीं,\nमेरा बेड़ा पार तुम्हई से है,\nसब कुछ सरकार तुम्हई से है ॥\nमैं तो भूल गयी कुछ भी कहना,\nतोरी प्रीत में रोवत है नैना,\nरग रग में बसी है प्रीत तोरी,\nअँखियन में खुमार तुम्हई से है,\nसब कुछ सरकार तुम्हई से है ॥\nमेरा दिल ले लो मेरी जाँ ले लो,\nमेरा तन ले लो मेरा मन ले लो,\nमेरे इश्क को निस्बत है तुमसे,\nजीवन श्रृंगार तुम्हई से है,\nसब कुछ सरकार तुम्हई से है ॥\nमैं तो भूल गयी सब सुख चैना,\nमोरे जबसे लड़े तुम संग नैना,\nमोरी नस नस में है प्रीत तोरी,\nमेरा सब आधार तुम्हई से है,\nसब कुछ सरकार तुम्हई से है ॥\nमेरा कोई नहीं है दुनिया में,\nमेरा कौल करार तुम्हई से है,\nमैं कहाँ जाकर सौदा बेचूँ,\nमेरा सब व्यापार तुम्हई से है,\nसब कुछ सरकार तुम्हई से है ॥\nये चमक ये दमक,\nफूलवन मा महक,\nसब कुछ सरकार तुम्हई से है,\nइठला के पवन,\nचूमे सैयाँ के चरण,\nबगियन मा बहार तुम्हई से है ॥"}, {"n": 18, "t": "तुम उठो सिया सिंगार करो", "l": "तुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है,\nशिव धनुष राम ने तोड़ा है,\nसीता से नाता जोड़ा है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥\nशीश सिया के चुनर सोहे,\nटीके की छवि न्यारी है,\nन्यारी न्यारी क्या कहिये,\nरघुवर को जानकी प्यारी है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥\nहाथ सिया के चूड़ी सोहे,\nकंगन की छवि न्यारी है,\nन्यारी न्यारी क्या कहिये,\nरघुवर को जानकी प्यारी है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥\nकमर सिया के तगड़ी सोहे,\nझुमके की छवि न्यारी है,\nन्यारी न्यारी क्या कहिये,\nरघुवर को जानकी प्यारी है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥\nपैर सिया के पायल सोहे,\nबिछिया की छवि न्यारी है,\nन्यारी न्यारी क्या कहिये,\nरघुवर को जानकी प्यारी है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है,\nशिव धनुष राम ने तोड़ा है,\nसीता से नाता जोड़ा है,\nतुम उठो सिया सिंगार करो,\nशिव धनुष राम ने तोड़ा है ॥"}, {"n": 19, "t": "मेरे सर पर रख दो बाबा", "l": "मेरे सर पर रख दो भगवन, अपने ये दोनों हाथ,\nदेना हो तो दीजिये, जनम-जनम का साथ ॥\nमेरे सर पर रख दो भगवन, अपने ये दोनों हाथ,\nदेना हो तो दीजिये, जनम-जनम का साथ ॥\nसुना है हमने शरणागत को अपने गले लगाते हो,\nऐसा हमने क्या माँगा जो देने से घबराते हो,\nचाहे सुख में रख या दुःख में, बस थामे रखियो हाथ ॥1॥\nझुलस रहे हैं ग़म की धूप में, प्यार की छैयाँ कर दे तू,\nबिन माँझी के नाव चले ना, अब पतवार पकड़ ले तू,\nमेरा रास्ता रौशन कर दो, छाई अँधियारी रात ॥2॥\nइसी जनम में सेवा देकर, बहुत बड़ा एहसान किया,\nतू ही माँझी तू ही खिवैया, मैंने तुझे पहचान लिया,\nरहे सात जनम, जन्मों तक बस रख लो इतनी बात ॥3॥"}, {"n": 20, "t": "वीर हनुमाना अति बलवाना", "l": "वीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nजो कोई आवे, अरज लगावे,\nसबकी सुनियो रे,\nप्रभु मन बसियो रे ।\nजो कोई आवे, अरज लगावे,\nसबकी सुनियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nबजरंग बाला, फेरूँ थारी माला,\nसंकट हरियो रे,\nप्रभु मन बसियो रे ।\nबजरंग बाला, फेरूँ थारी माला,\nसंकट हरियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nना कोई संगी, हाथ की तंगी,\nजल्दी हरियो रे,\nप्रभु मन बसियो रे ।\nना कोई संगी, हाथ की तंगी,\nजल्दी हरियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nअर्ज़ी हमारी, मर्ज़ी तुम्हारी,\nकृपा करियो रे,\nप्रभु मन बसियो रे ।\nअर्ज़ी हमारी, मर्ज़ी तुम्हारी,\nकृपा करियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nरामजी का प्यारा, सिया का दुलारा,\nसंकट हरियो रे,\nप्रभु मन बसियो रे ।\nरामजी का प्यारा, सिया का दुलारा,\nसंकट हरियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।\nवीर हनुमाना अति बलवाना,\nराम नाम रसियो रे,\nप्रभु मन बसियो रे ।"}, {"n": 21, "t": "फूलों से सजाया दरबार गजानन आ जाना", "l": "फूलों से सजाया दरबार गजानन आ जाना,\nआ जाना महाराज गजानन आ जाना ॥\nघर के अंदर भवन बनाया,\nआओ विराजो महाराज गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nहाथ में लोटा गंगाजल पानी,\nचरण धुलाऊँ महाराज गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nचुन-चुन कलियाँ मैं फूल ले आई,\nसोणा बनाया मैं हार गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nहाथ कटोरी केसर रोली,\nतिलक लगाऊँ महाराज गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nमोदक का मैंने भोग बनाया,\nलड्डुअन के भर थाल गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nहाथ में ज्योति जगमग होती,\nआरती उतारूँ महाराज गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥\nसब भक्तों की एक अर्ज़ है,\nदर्शन दो महाराज गजानन आ जाना,\nफूलों से सजाया दरबार गजानन आ जाना ॥"}, {"n": 22, "t": "कीर्तन की है रात बाबा आज थाणे आणो है", "l": "कीर्तन की है रात बाबा आज थाणे आणो है,\nथारे कोल निभानु है ॥\nकीर्तन की है रात बाबा आज थाणे आणो है,\nथारे कोल निभानु है ॥\nदरबार सांवरिया, ऐसो सजो प्यारो, दयालु आप को,\nसेवा में सांवरिया, सगला खड़ा डिगे, हुकम बस आप को,\nसेवा में थारी म्हणे आज बिछ जाणु है, थारे कोल निभानु है,\nकीर्तन की है रात...\nकीर्तन की है तैयारी, कीर्तन करां जमकर, प्रभु क्यूँ देर करो,\nवादो थारो दाता, कीर्तन में आने को, घणी मत देर करो,\nभजनां सूं थाणे म्हणे आज रिझाणु है, थारे कोल निभानु है,\nकीर्तन की है रात...\nजो कुछ बणो म्हासूं, अर्पण प्रभु सारो, प्रभु स्वीकार करो,\nनादाँ सूं गलती होती ही आई है, प्रभु मत ध्यान धरो,\nनंदू सांवरिया थाणो दास पुराणो है, थारे कोल निभानु है,\nकीर्तन की है रात..."}, {"n": 23, "t": "बाजरे की रोटी खाले श्याम", "l": "बाजरे की रोटी खाले श्याम,\nके चूरमा ने भूल जावेलो,\nजाटनी के हाथ की बनी रे कमाल की,\nसंग लाया हांडी बाबा कढ़ी और दाल की,\nगुड़ मीठो मीठो मेरा श्याम,\nके चूरमा ने भूल जावेलो,\nबाजरे की रोटी खाले श्याम ॥\nबाजरो ऐसो है बाबा ठण्ड नहीं लागे,\nदस बीस कोस बाबा खा के तू भागे,\nगोडा में आवे गई तेरे जान,\nके चूरमा ने भूल जावेलो,\nबाजरे की रोटी खाले श्याम ॥\nबाजरे की रोटी सागे साँच का सब्र ता,\nखाये के मारलो बाबा मुश् का रगड़ता,\nरोट का करे गुणगान,\nके चूरमा ने भूल जावेलो,\nबाजरे की रोटी खाले श्याम ॥\nबनवारी रोट ऐसो ढूंढ़तो रवे जो,\nहरयानो पतो मेरो पूछतो रवोगे,\nपूछतो रवोगे मेरो नाम,\nके चूरमा ने भूल जावेलो,\nबाजरे की रोटी खाले श्याम ॥"}, {"n": 24, "t": "जितना राधा रोई-रोई कान्हा के लिए", "l": "जितना राधा रोई-रोई कान्हा के लिए,\nकन्हैया उतना रोया-रोया है सुदामा के लिए ॥\nयार की हालत देखि, उसकी हालत पे रोया,\nयार के आगे अपनी शानो शौकत पे रोया,\nऐसे तड़पा जैसे शमा परवाना के लिए,\nकन्हैया उतना रोया-रोया है सुदामा के लिए ॥\nयार को लगा कलेजे बात भर भर के रोया,\nऔर अपने बचपन को याद कर कर के रोया,\nये ऋण था अनमोल की श्याम दीवाना के लिए,\nकन्हैया उतना रोया-रोया है सुदामा के लिए ॥\nपाँव के छाले देखे तो दुःख के मारे रोया,\nपाँव धोने के ख़ातिर ख़ुशी के मारे रोया,\nआँसू थे भरपाई बस हर्जाना के लिए,\nकन्हैया उतना रोया-रोया है सुदामा के लिए ॥\nउसके आने से रोया, उसके जाने से रोया,\nहोके गदगद चावल के दाने दाने पे रोया,\nबनवारी वो रोया बस याराना के लिए,\nकन्हैया उतना रोया-रोया है सुदामा के लिए ॥"}, {"n": 25, "t": "हे दुःख भंजन, मारुति नंदन", "l": "हे दुःख भंजन, मारुति नंदन,\nसुन लो मेरी पुकार ।\nपवनसुत विनती बारम्बार ॥\nहे दुःख भंजन, मारुति नंदन,\nसुन लो मेरी पुकार ।\nपवनसुत विनती बारम्बार ॥\nअष्ट सिद्धि, नव निधि के दाता,\nदुखियों के तुम भाग्यविधाता ।\nसियाराम के काज सँवारे,\nमेरा करो उद्धार ॥\nपवनसुत विनती बारम्बार ॥\nहे दुःख भंजन, मारुति नंदन,\nसुन लो मेरी पुकार ।\nपवनसुत विनती बारम्बार ॥\nअपरम्पार है शक्ति तुम्हारी,\nतुम पर रीझे अवधबिहारी ।\nभक्तिभाव से ध्याऊँ तोहे,\nकर दुखों से पार ॥\nपवनसुत विनती बारम्बार ॥\nहे दुःख भंजन, मारुति नंदन,\nसुन लो मेरी पुकार ।\nपवनसुत विनती बारम्बार ॥\nजपूँ निरंतर नाम तिहारा,\nअब नहीं छोड़ूँ तेरा द्वारा ।\nरामभक्त मोहे शरण में लीजे,\nभव सागर से तार ॥\nपवनसुत विनती बारम्बार ॥"}, {"n": 26, "t": "राधे तेरे चरणों की गर धूल जो मिल जाए", "l": "राधे तेरे चरणों की गर धूल जो मिल जाए,\nश्यामा तेरे चरणों की गर धूल जो मिल जाए।\nसच कहता हूँ मेरी तक़दीर बदल जाए ॥\nराधे तेरी रहमत दिन रात बरसती है।\nएक बूँद जो मिल जाए, मन की कली खिल जाए ॥\nयह मन बड़ा चंचल है, कैसे तेरा भजन करूँ।\nजितना इसे समझाऊँ, उतना ही मचल जाए ॥\nनज़रों से गिराना ना, चाहे जो भी सज़ा देना।\nनज़रों से जो गिर जाए, मुश्किल ही सँभल पाए ॥\nराधे इस जीवन की बस एक तमन्ना है।\nतुम सामने हो मेरे, मेरा दम ही निकल जाए ॥"}, {"n": 27, "t": "श्रीमन नारायण नारायण हरि हरि", "l": "श्रीमन नारायण नारायण हरि हरि (×2)\nतेरी लीला सबसे न्यारी न्यारी हरि हरि (×2)\nभजमन नारायण नारायण हरि हरि (×2)\nजय जय नारायण नारायण हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nहरि ॐ नमो नारायणा, ॐ नमो नारायणा (×2)\nलक्ष्मी नारायण नारायण हरि हरि (×2)\nबोलो नारायण नारायण हरि हरि (×2)\nभजो नारायण नारायण हरि हरि (×2)\nजय जय नारायण नारायण हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nतेरी लीला सबसे न्यारी न्यारी हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nहरि ॐ नमो नारायणा, ॐ नमो नारायणा (×2)\nसत्य नारायण नारायण हरि हरि (×2)\nजपो नारायण नारायण हरि हरि (×2)\nभजो नारायण नारायण हरि हरि (×2)\nजय जय नारायण नारायण हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nतेरी लीला सबसे न्यारी न्यारी हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nहरि ॐ नमो नारायणा, ॐ नमो नारायणा (×2)\nबोलो नारायण नारायण हरि हरि (×2)\nभजमन नारायण नारायण हरि हरि (×2)\nजय जय नारायण नारायण हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nतेरी लीला सबसे न्यारी न्यारी हरि हरि (×2)\nश्रीमन नारायण नारायण हरि हरि (×2)\nहरि ॐ नमो नारायणा, ॐ नमो नारायणा (×2)"}, {"n": 28, "t": "राम स्तुति — श्री रामचन्द्र कृपालु (Ram Stuti)", "l": "श्री रामचन्द्र कृपालु भजु मन\nहरण भवभय दारुणं ।\nनव कंज लोचन कंज मुख\nकर कंज पद कंजारुणं ॥1॥\nकन्दर्प अगणित अमित छवि\nनवनील नीरद सुन्दरं ।\nपटपीत मानहुँ तड़ित रुचि शुचि\nनौमि जनक सुतावरं ॥2॥\nभजु दीनबन्धु दिनेश दानव\nदैत्य वंश निकन्दनं ।\nरघुनन्द आनन्द कन्द कोशल\nचन्द दशरथ नन्दनं ॥3॥\nशिर मुकुट कुंडल तिलक\nचारु उदारु अंग विभूषणं ।\nआजानु भुज शर चाप धर\nसंग्राम जित खरदूषणं ॥4॥\nइति वदति तुलसीदास शंकर\nशेष मुनि मन रंजनं ।\nमम हृदय कंज निवास कुरु\nकामादि खलदल गंजनं ॥5॥\nमन जाहि राच्यो मिलहि सो\nवर सहज सुन्दर सांवरो ।\nकरुणा निधान सुजान शील\nस्नेह जानत रावरो ॥6॥\nएहि भांति गौरी असीस सुन सिय\nसहित हिय हरषित अली ।\nतुलसी भवानिहि पूजी पुनि-पुनि\nमुदित मन मन्दिर चली ॥7॥\nजानी गौरी अनुकूल सिय\nहिय हरषु न जाइ कहि ।\nमंजुल मंगल मूल वाम\nअंग फरकन लगे ॥"}, {"n": 29, "t": "गणपति आरती 1 — जय गणेश देवा (Ganapati Aarti 1)", "l": "जय गणेश, जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा ॥\nएक दंत दयावंत, चार भुजा धारी।\nमाथे सिंदूर सोहे, मूस की सवारी ॥\nजय गणेश, जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा ॥\nपान चढ़े, फल चढ़े और चढ़े मेवा।\nलड्डुअन को भोग लागे, संत करें सेवा ॥\nजय गणेश, जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा ॥\nअंधे को आँख देत, कोढ़िन को काया।\nबाँझन को पुत्र देत, निर्धन को माया ॥\nजय गणेश, जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा ॥\n'सूर' श्याम शरण आए, सफल कीजे सेवा।\nमाता जाकी पार्वती, पिता महादेवा ॥\nजय गणेश, जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा ॥"}, {"n": 30, "t": "ॐ जय जगदीश हरे (Om Jai Jagdish Hare)", "l": "ॐ जय जगदीश हरे,\nस्वामी जय जगदीश हरे ।\nभक्त जनों के संकट,\nदास जनों के संकट,\nक्षण में दूर करे ॥\n॥ ॐ जय जगदीश हरे..॥\nजो ध्यावे फल पावे,\nदुःख बिनसे मन का,\nस्वामी दुःख बिनसे मन का ।\nसुख सम्पति घर आवे,\nसुख सम्पति घर आवे,\nकष्ट मिटे तन का ॥\n॥ ॐ जय जगदीश हरे..॥\nमात पिता तुम मेरे,\nशरण गहूँ किसकी,\nस्वामी शरण गहूँ मैं किसकी ।\nतुम बिन और न दूजा,\nतुम बिन और न दूजा,\nआस करूँ मैं जिसकी ॥\n॥ ॐ जय जगदीश हरे..॥\nतुम पूरण परमात्मा,\nतुम अन्तर्यामी,\nस्वामी तुम अन्तर्यामी ।\nपारब्रह्म परमेश्वर,\nपारब्रह्म परमेश्वर,\nतुम सब के स्वामी ॥\n॥ ॐ जय जगदीश हरे..॥\nतुम करुणा के सागर,\nतुम पालनकर्ता,\nस्वामी तुम पालनकर्ता ।\nमैं मूरख फलकामी,\nमैं सेवक तुम स्वामी,\nकृपा करो भर्ता ॥\n॥ ॐ जय जगदीश हरे..॥\nतुम हो एक अगोचर,\nसबके प्राणपति,\nस्वामी सबके प्राणपति ।\nकिस विधि मिलूँ दयामय,\nकिस विधि मिलूँ दयामय,\nतुमको मैं कुमति ॥\n॥ ॐ जय जगदीश हरे..॥\nदीन-बन्धु दुःख-हर्ता,\nठाकुर तुम मेरे,\nस्वामी रक्षक तुम मेरे ।\nअपने हाथ उठाओ,\nअपने शरण लगाओ,\nद्वार पड़ा तेरे ॥\n॥ ॐ जय जगदीश हरे..॥\nविषय-विकार मिटाओ,\nपाप हरो देवा,\nस्वामी पाप (कष्ट) हरो देवा ।\nश्रद्धा भक्ति बढ़ाओ,\nश्रद्धा भक्ति बढ़ाओ,\nसंतन की सेवा ॥\nॐ जय जगदीश हरे,\nस्वामी जय जगदीश हरे ।\nभक्त जनों के संकट,\nदास जनों के संकट,\nक्षण में दूर करे ॥"}, {"n": 31, "t": "गणपति आरती 2 — गणपति की सेवा मंगल मेवा (Ganapati Aarti 2)", "l": "गणपति की सेवा मंगल मेवा, सेवा से सब विघ्न टरैं।\nतीन लोक के सकल देवता, द्वार खड़े नित अर्ज करें ॥\nगणपति की सेवा मंगल मेवा...\nरिद्धि-सिद्धि दक्षिण वाम विराजें, अरु आनन्द सों चमर करें।\nधूप-दीप अरु लिए आरती, भक्त खड़े जयकार करें ॥\nगणपति की सेवा मंगल मेवा...\nगुड़ के मोदक भोग लगत हैं, मूषक वाहन चढ़्या सरैं।\nसौम्य रूप को देख गणपति के, विघ्न भाग जा दूर परैं ॥\nगणपति की सेवा मंगल मेवा...\nभादो मास अरु शुक्ल चतुर्थी, दिन दोपारा दूर परैं।\nलियो जन्म गणपति प्रभु जी, दुर्गा मन आनन्द भरैं ॥\nगणपति की सेवा मंगल मेवा...\nअद्भुत बाजा बजा इन्द्र का, देव बंधु सब गान करें।\nश्री शंकर के आनन्द उपज्या, नाम सुन्यो सब विघ्न टरैं ॥\nगणपति की सेवा मंगल मेवा...\nआनि विधाता बैठे आसन, इन्द्र अप्सरा नृत्य करें।\nदेख वेद ब्रह्मा जी जाको, विघ्न विनाशक नाम धरैं ॥\nगणपति की सेवा मंगल मेवा...\nएकदन्त गजवदन विनायक, त्रिनयन रूप अनूप धरैं।\nपगथंभा सा उदर पुष्ट है, देव चन्द्रमा हास्य करैं ॥\nगणपति की सेवा मंगल मेवा...\nदे शराप श्री चन्द्रदेव को, कलाहीन तत्काल करें।\nचौदह लोक में फिरें गणपति, तीन लोक में राज्य करैं ॥\nगणपति की सेवा मंगल मेवा...\nउठि प्रभात जप करैं ध्यान कोई, ताके कारज सर्व सरैं।\nपूजा काल आरती गावैं, ताके शिर यश छत्र फिरें ॥\nगणपति की सेवा मंगल मेवा...\nगणपति की पूजा पहले करने से, काम सभी निर्विघ्न सरैं।\nसभी भक्त गणपति जी के, हाथ जोड़कर स्तुति करैं ॥\nगणपति की सेवा मंगल मेवा..."}, {"n": 32, "t": "चोखा कोनी लागसी (राजस्थानी गीत)", "l": "दूल्हो बारात बिना, बादल बरसात बिना,\nसफर कोई के साथ बिना — चोखो कोनी लागसी\nक्षत्रिय तलवार बिना, जीमण मनुहार बिना,\nउत्सव परिवार बिना — चोखा कोनी लागसी ॥\nघर तो लुगाई बिना, आदमी कमाई बिना,\nसियाळो रजाई बिना — चोखो कोनी लागसी\nसासरो साळी बिना, महल झरोखा जाली बिना,\nखेत हरियाली बिना — चोखा कोनी लागसी ॥\nमंदिर टंकारा (घण्टी) बिना, जागरण जयकारा बिना,\nबातां हुंकारा बिना — चोखा कोनी लागसी\nपंडित जी चोटी बिना, पहलवान लंगोटी बिना,\nसब्जी तो रोटी बिना — चोखी कोनी लागसी ॥\nरात्रि चंद बिना, फूल सुगंध बिना,\nब्याव भाईबंध बिना — चोखो कोनी लागसी\nपंछी पंख बिना, हाथी दंत बिना,\nपिक्चर (फिल्म) अंत बिना — चोखा कोनी लागसी ॥\nब्याह शादी गीत बिना, दोस्ती प्रीत बिना,\nखेल हार जीत बिना — चोखा कोनी लागसी\nघोड़ी चाल बिना, गाणो सुर ताल बिना,\nचूरमो दाल बिना — चोखो कोनी लागसी ॥\nइंसान गुण बिना, गीत ग़ज़ल धुन बिना,\nभोजन लूण बिना — चोखो कोनी लागसी\nजीवन त्योहार बिना, अतिथि सत्कार बिना,\nगौरी भरतार बिना — चोखा कोनी लागसी ॥"}];</script>
